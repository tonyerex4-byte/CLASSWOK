
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Leopard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #126000;
      font-family: Arial, sans-serif;
      padding: 21px 30px;
    }

    .animal-card {
      width: 220px;
      min-height: 203px;
      padding: 18px 16px;
      background-color: #ffffdf;
      border: 3px solid #75a94e;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    h3 {
      margin: 10px 0 14px;
      color: #318b36;
      font-size: 15px;
    }

    p {
      margin: 0 0 11px;
      color: #455c4e;
      font-size: 11.5px;
      line-height: 1.25;
    }

    .fact {
      margin-top: 12px;
      color: #ff9418;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div class="animal-card">
    <h3>Snow Leopard</h3>

    <p>Type: Big Cat</p>

    <p>Lives in: Mountain ranges of Central Asia</p>

    <p>Diet: Deer, goats, and wild sheep</p>

    <p class="fact">
      Cool Fact: Can leap up to 15 metres in one jump!
    </p>
  </div>
</body>
</html>
